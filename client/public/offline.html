<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B6B4F" />
    <title>NIO FAR — Mode hors-ligne</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f1e7;
        color: #14231c;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14231c; color: #f6f1e7; }
        .card { background: #1b2e25 !important; border-color: rgba(246, 241, 231, 0.15) !important; }
      }
      .card {
        max-width: 28rem;
        background: #fffdf8;
        border: 1px solid rgba(20, 35, 28, 0.12);
        border-radius: 2rem;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 18px 40px -22px rgba(20, 35, 28, 0.35);
      }
      .badge {
        display: inline-block;
        background: #e0a21b;
        color: #14231c;
        font-weight: 800;
        font-size: 0.78rem;
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      h1 { margin: 1rem 0 0.5rem; font-size: 1.65rem; }
      p { opacity: 0.85; line-height: 1.5; font-size: 0.95rem; }
      .actions { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a, button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 1.4rem;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
        border: none;
        cursor: pointer;
      }
      .primary { background: #0b6b4f; color: #ffffff; }
      .secondary { background: #e0a21b; color: #14231c; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Hors-ligne · NIO FAR</span>
      <h1>Pas de réseau pour le moment</h1>
      <p>
        Vous êtes actuellement hors connexion. Vos signalements enregistrés dans la file d’attente locale seront
        synchronisés automatiquement dès le retour du réseau.
      </p>
      <div class="actions">
        <a href="/signaler" class="secondary">Préparer un signalement hors-ligne</a>
        <button type="button" class="primary" onclick="window.location.reload()">Réessayer</button>
      </div>
    </main>
  </body>
</html>
