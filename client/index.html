<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="NIO FAR — signalez, suivez et vérifiez les problèmes de proximité de votre quartier en banlieue de Dakar : déchets, eau stagnante, éclairage public, voirie." />
    <meta name="theme-color" content="#0B6B4F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NIO FAR" />
    <meta property="og:title" content="NIO FAR — Les problèmes de votre quartier, enfin suivis." />
    <meta property="og:description" content="Plateforme citoyenne de suivi des problèmes de proximité en banlieue de Dakar. Prototype — Banlieue Smart Genius 2026." />
    <title>NIO FAR — Les problèmes de votre quartier, enfin suivis.</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('niofar-theme');
          var d = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>NIO FAR nécessite JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
