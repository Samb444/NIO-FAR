services:
  postgres:
    image: postgres:16-alpine
    container_name: niofar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niofar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niofar_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-niofar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - niofar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-niofar} -d $${POSTGRES_DB:-niofar}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  niofar_pgdata:
