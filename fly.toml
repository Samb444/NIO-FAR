# ============================================================================
# NIO FAR — Configuration Fly.io (API + Front PWA + PostgreSQL)
# ============================================================================
app = "nio-far"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  PGLITE_FALLBACK = "true"
  PGLITE_DATA_DIR = "/data/pgdata"
  UPLOAD_DIR = "/data/uploads"
  WOLOF_ASR_ENABLED = "false"

[[mounts]]
  source = "niofar_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"
