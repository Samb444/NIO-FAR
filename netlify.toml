# ============================================================================
# NIO FAR — Configuration Netlify (Frontend React + Vite + PWA)
# ============================================================================
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# En production séparée Front (Netlify) + API (Render/Railway/Fly.io),
# définir VITE_API_URL=https://votre-api-niofar.onrender.com/api dans les variables Netlify
# ou remplacer l'URL cible du proxy /api/* ci-dessous.
[[redirects]]
  from = "/api/*"
  to = "https://nio-far-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
