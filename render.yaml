# ============================================================================
# NIO FAR — Blueprint Render.com (API Node.js + Base PostgreSQL 16 managée)
# Permet aussi de servir le front compilé (client/dist) en mode tout-en-un.
# ============================================================================
databases:
  - name: nio-far-postgres
    databaseName: niofar
    user: niofar
    plan: free

services:
  - type: web
    name: nio-far-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: nio-far-postgres
          property: connectionString
      - key: PGLITE_FALLBACK
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_HASH_SALT
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: WOLOF_ASR_ENABLED
        value: "false"
      - key: LLM_CATEGORY_ENABLED
        value: "false"
